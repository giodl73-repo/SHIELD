[workspace]
resolver = "2"
members = [
    "crates/shield-network",
    "crates/shield-corpus",
    "crates/shield-score",
    "crates/shield-tier",
    "crates/shield-gap",
    "crates/shield-cms-access",
    "crates/shield-cli",
    "crates/shield-web",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

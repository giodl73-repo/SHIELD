name: Aggregate adaptation proposal
description: Propose a bounded SHIELD aggregate healthcare-access review.
title: "Aggregate adaptation: "
labels: ["adoption", "privacy-boundary"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for aggregate-only SHIELD work. Do not include patient records or individual medical advice.
  - type: input
    id: scope
    attributes:
      label: Bounded scope
      placeholder: "Example: regional referral access and workforce strain"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Healthcare-access promise question
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Aggregate source surfaces
    validations:
      required: true
  - type: textarea
    id: held
    attributes:
      label: Claims that must stay held
    validations:
      required: true
